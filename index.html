<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story ♡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --rose: #c8687a;
    --rose-light: #f5dde2;
    --rose-deep: #8c3a4a;
    --blush: #fdf0f2;
    --cream: #fdf8f5;
    --ink: #2a1a1f;
    --ink-soft: #6b4a52;
    --gold: #c9a85c;
    --gold-light: #f7eedd;
    --border: rgba(200,104,122,0.18);
    --shadow: 0 4px 24px rgba(140,58,74,0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }

  /* HERO HEADER */
  .hero {
    background: linear-gradient(160deg, #f5dde2 0%, #fdf0f2 50%, #f7eedd 100%);
    border-bottom: 1px solid var(--border);
    padding: 2.5rem 2rem 2rem;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '♡';
    position: absolute;
    font-size: 180px;
    opacity: 0.05;
    top: -30px; right: -20px;
    color: var(--rose);
    pointer-events: none;
  }
  .hero h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3rem);
    color: var(--rose-deep);
    letter-spacing: -0.02em;
    line-height: 1.1;
  }
  .hero h1 span { font-style: italic; color: var(--rose); }
  .couple-names {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    margin: 1rem 0 0.5rem;
  }
  .couple-names input {
    font-family: 'Playfair Display', serif;
    font-size: 1.1rem;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--rose);
    padding: 4px 8px;
    color: var(--rose-deep);
    text-align: center;
    width: 130px;
    outline: none;
  }
  .couple-names input::placeholder { color: var(--rose); opacity: 0.5; }
  .heart-sep { color: var(--rose); font-size: 1.2rem; }
  .together-since {
    font-size: 0.85rem;
    color: var(--ink-soft);
    margin-top: 0.4rem;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .together-since input[type="date"] {
    border: none; border-bottom: 1px solid var(--rose);
    background: transparent; color: var(--rose-deep);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem; outline: none; padding: 2px 4px;
  }
  .counter-pill {
    display: inline-block;
    background: var(--rose);
    color: white;
    border-radius: 999px;
    padding: 3px 14px;
    font-size: 0.8rem;
    font-weight: 500;
    margin-top: 0.6rem;
  }

  /* NAV TABS */
  .tabs {
    display: flex;
    gap: 0;
    padding: 0 2rem;
    border-bottom: 1.5px solid var(--border);
    background: white;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .tab {
    padding: 1rem 1.4rem;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--ink-soft);
    cursor: pointer;
    border-bottom: 2.5px solid transparent;
    white-space: nowrap;
    transition: all 0.2s;
    user-select: none;
  }
  .tab:hover { color: var(--rose); }
  .tab.active { color: var(--rose-deep); border-bottom-color: var(--rose); }

  /* PANELS */
  .panels { padding: 2rem; max-width: 860px; margin: 0 auto; }
  .panel { display: none; animation: fadeIn 0.3s ease; }
  .panel.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* SECTION TITLE */
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    color: var(--rose-deep);
    margin-bottom: 1.2rem;
    display: flex; align-items: center; gap: 10px;
  }
  .section-title span { font-size: 1.1rem; }

  /* CARDS */
  .card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.4rem 1.6rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow);
  }
  .card-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  @media(max-width: 560px) { .card-row { grid-template-columns: 1fr; } }

  /* FORM ELEMENTS */
  label { display: block; font-size: 0.8rem; color: var(--ink-soft); margin-bottom: 4px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; }
  input[type="text"], input[type="date"], textarea, select {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    background: var(--blush);
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--rose); background: white; }
  textarea { resize: vertical; min-height: 80px; }
  .btn {
    padding: 10px 24px;
    background: var(--rose);
    color: white;
    border: none;
    border-radius: 999px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn:hover { background: var(--rose-deep); transform: translateY(-1px); }
  .btn-ghost {
    background: transparent;
    color: var(--rose);
    border: 1.5px solid var(--rose);
  }
  .btn-ghost:hover { background: var(--rose-light); transform: none; }
  .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
  .form-row { margin-bottom: 1rem; }
  .form-actions { display: flex; gap: 10px; margin-top: 1.2rem; }

  /* MEMORY ITEMS */
  .memory-item {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.2rem 1.4rem;
    margin-bottom: 0.8rem;
    box-shadow: 0 2px 12px rgba(140,58,74,0.05);
    display: flex; gap: 1rem; align-items: flex-start;
    transition: box-shadow 0.2s;
  }
  .memory-item:hover { box-shadow: var(--shadow); }
  .memory-emoji {
    font-size: 1.8rem;
    min-width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    background: var(--rose-light);
    border-radius: 10px;
  }
  .memory-body { flex: 1; }
  .memory-title { font-weight: 500; font-size: 1rem; margin-bottom: 2px; }
  .memory-desc { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 4px; line-height: 1.5; }
  .memory-meta { display: flex; gap: 10px; align-items: center; }
  .memory-date { font-size: 0.78rem; color: var(--rose); font-weight: 500; }
  .tag {
    font-size: 0.72rem; padding: 2px 10px; border-radius: 999px;
    background: var(--rose-light); color: var(--rose-deep); font-weight: 500;
  }
  .delete-btn {
    background: none; border: none; cursor: pointer;
    color: #ccc; font-size: 1rem; padding: 4px;
    transition: color 0.2s; line-height: 1;
  }
  .delete-btn:hover { color: var(--rose); }
  .empty-state {
    text-align: center; padding: 3rem 1rem;
    color: var(--ink-soft); font-size: 0.9rem;
  }
  .empty-state .big { font-size: 2.5rem; margin-bottom: 0.5rem; }

  /* ANNIVERSARY ITEMS */
  .anni-item {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.1rem 1.4rem;
    margin-bottom: 0.8rem;
    display: flex; align-items: center; gap: 1.2rem;
    box-shadow: 0 2px 12px rgba(140,58,74,0.04);
  }
  .anni-countdown {
    text-align: center;
    background: var(--rose-light);
    border-radius: 12px;
    padding: 0.6rem 1rem;
    min-width: 70px;
  }
  .anni-days { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--rose-deep); line-height: 1; }
  .anni-label { font-size: 0.7rem; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.05em; }
  .anni-body { flex: 1; }
  .anni-name { font-weight: 500; font-size: 1rem; }
  .anni-date { font-size: 0.82rem; color: var(--ink-soft); margin-top: 2px; }
  .anni-soon { background: var(--gold-light); }
  .anni-days-soon { color: var(--gold); }
  .anni-today { background: var(--rose); }
  .anni-days-today { color: white; }
  .anni-label-today { color: rgba(255,255,255,0.8); }

  /* DATE NIGHT */
  .date-idea-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 0.8rem;
    margin-bottom: 1.5rem;
  }
  .date-idea {
    background: white;
    border: 1.5px solid var(--border);
    border-radius: 14px;
    padding: 1rem;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
    user-select: none;
  }
  .date-idea:hover, .date-idea.picked { border-color: var(--rose); background: var(--rose-light); }
  .date-idea .di-emoji { font-size: 2rem; margin-bottom: 6px; }
  .date-idea .di-name { font-size: 0.85rem; font-weight: 500; color: var(--ink); }
  .date-idea .di-desc { font-size: 0.75rem; color: var(--ink-soft); margin-top: 2px; }
  .spin-area {
    background: white;
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .spin-result {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    color: var(--rose-deep);
    margin: 1rem 0;
    min-height: 2.2rem;
  }
  .spin-result span { font-style: italic; }

  /* LOVE NOTES */
  .notes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media(max-width: 560px) { .notes-grid { grid-template-columns: 1fr; } }
  .note-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.2rem;
    box-shadow: var(--shadow);
    position: relative;
  }
  .note-from {
    font-size: 0.75rem; color: var(--rose);
    font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .note-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--ink);
    line-height: 1.6;
  }
  .note-ts { font-size: 0.72rem; color: #ccc; margin-top: 8px; }
  .note-del {
    position: absolute; top: 10px; right: 10px;
    background: none; border: none; cursor: pointer;
    color: #ddd; font-size: 0.9rem;
    transition: color 0.2s;
  }
  .note-del:hover { color: var(--rose); }

  /* STATS */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
  .stat-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.2rem 1rem;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .stat-num { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--rose-deep); line-height: 1; }
  .stat-label { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; }

  /* MOOD */
  .mood-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 0.5rem 0 1rem; }
  .mood-btn {
    background: var(--blush); border: 1.5px solid var(--border);
    border-radius: 999px; padding: 6px 14px;
    font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
    font-family: 'DM Sans', sans-serif;
    color: var(--ink);
  }
  .mood-btn:hover, .mood-btn.sel { background: var(--rose-light); border-color: var(--rose); color: var(--rose-deep); font-weight: 500; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rose-light); border-radius: 3px; }

  /* confetti burst */
  .confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <h1>Our <span>Love</span> Story</h1>
  <div class="couple-names">
    <input type="text" id="name1" placeholder="Your name" maxlength="20">
    <span class="heart-sep">♡</span>
    <input type="text" id="name2" placeholder="Partner's name" maxlength="20">
  </div>
  <div class="together-since">
    <span>Together since</span>
    <input type="date" id="startDate">
  </div>
  <div id="dayCounter" class="counter-pill" style="display:none;"></div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('memories')">✨ Memories</div>
  <div class="tab" onclick="switchTab('anniversaries')">📅 Anniversaries</div>
  <div class="tab" onclick="switchTab('datenights')">🌙 Date Nights</div>
  <div class="tab" onclick="switchTab('notes')">💌 Love Notes</div>
  <div class="tab" onclick="switchTab('stats')">💖 Our Stats</div>
</div>

<!-- PANELS -->
<div class="panels">

  <!-- MEMORIES PANEL -->
  <div class="panel active" id="panel-memories">
    <div class="section-title"><span>✨</span> Our Memories</div>

    <div class="card">
      <div class="card-row">
        <div class="form-row">
          <label>Memory Title</label>
          <input type="text" id="m-title" placeholder="First date at the Italian place…">
        </div>
        <div class="form-row">
          <label>Date</label>
          <input type="date" id="m-date">
        </div>
      </div>
      <div class="form-row">
        <label>Description</label>
        <textarea id="m-desc" placeholder="What made this moment special?"></textarea>
      </div>
      <div class="card-row">
        <div class="form-row">
          <label>Category</label>
          <select id="m-cat">
            <option value="🌹 Romantic">🌹 Romantic</option>
            <option value="✈️ Travel">✈️ Travel</option>
            <option value="🍽️ Food">🍽️ Food & Drink</option>
            <option value="🎉 Celebration">🎉 Celebration</option>
            <option value="🏠 Home">🏠 At Home</option>
            <option value="🎭 Adventure">🎭 Adventure</option>
            <option value="💫 Milestone">💫 Milestone</option>
            <option value="😂 Funny">😂 Funny</option>
          </select>
        </div>
        <div class="form-row">
          <label>Feeling</label>
          <select id="m-feel">
            <option value="💕 Loved">💕 Loved</option>
            <option value="😄 Happy">😄 Happy</option>
            <option value="🥹 Touched">🥹 Touched</option>
            <option value="😍 In awe">😍 In awe</option>
            <option value="😂 Hilarious">😂 Hilarious</option>
            <option value="🥰 Cozy">🥰 Cozy</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="addMemory()">Add Memory ♡</button>
      </div>
    </div>

    <div id="memories-list"></div>
  </div>

  <!-- ANNIVERSARIES PANEL -->
  <div class="panel" id="panel-anniversaries">
    <div class="section-title"><span>📅</span> Important Dates</div>

    <div class="card">
      <div class="card-row">
        <div class="form-row">
          <label>Date Name</label>
          <input type="text" id="a-name" placeholder="First kiss, Engagement…">
        </div>
        <div class="form-row">
          <label>Date</label>
          <input type="date" id="a-date">
        </div>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="addAnniversary()">Add Date ♡</button>
      </div>
    </div>

    <div id="anniversaries-list"></div>
  </div>

  <!-- DATE NIGHTS PANEL -->
  <div class="panel" id="panel-datenights">
    <div class="section-title"><span>🌙</span> Date Night Ideas</div>

    <div class="date-idea-grid" id="date-ideas-grid"></div>

    <div class="spin-area">
      <div style="font-size:0.85rem; color:var(--ink-soft); margin-bottom: 0.5rem;">Can't decide? Let fate choose ✨</div>
      <div class="spin-result" id="spin-result">—</div>
      <button class="btn" onclick="spinDateIdea()">✨ Pick For Us!</button>
    </div>

    <div style="margin-top: 1.5rem;">
      <div class="section-title" style="font-size: 1.1rem;"><span>📝</span> Add Custom Idea</div>
      <div class="card">
        <div class="card-row">
          <div class="form-row">
            <label>Idea Name</label>
            <input type="text" id="di-name" placeholder="Stargazing picnic…">
          </div>
          <div class="form-row">
            <label>Emoji</label>
            <input type="text" id="di-emoji" placeholder="🌟" maxlength="2">
          </div>
        </div>
        <div class="form-row">
          <label>Description</label>
          <input type="text" id="di-desc" placeholder="Pack a blanket and snacks">
        </div>
        <div class="form-actions">
          <button class="btn" onclick="addDateIdea()">Add Idea</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LOVE NOTES PANEL -->
  <div class="panel" id="panel-notes">
    <div class="section-title"><span>💌</span> Love Notes</div>
    <div class="card">
      <div class="card-row">
        <div class="form-row">
          <label>From</label>
          <input type="text" id="n-from" placeholder="Your name">
        </div>
        <div class="form-row">
          <label>Mood</label>
          <div class="mood-row" id="mood-row">
            <button class="mood-btn" onclick="selectMood(this,'💕 Loving')">💕 Loving</button>
            <button class="mood-btn" onclick="selectMood(this,'😘 Flirty')">😘 Flirty</button>
            <button class="mood-btn" onclick="selectMood(this,'🥰 Grateful')">🥰 Grateful</button>
            <button class="mood-btn" onclick="selectMood(this,'😂 Playful')">😂 Playful</button>
            <button class="mood-btn" onclick="selectMood(this,'🥹 Sentimental')">🥹 Sentimental</button>
          </div>
        </div>
      </div>
      <div class="form-row">
        <label>Your Note</label>
        <textarea id="n-text" placeholder="Write something sweet…"></textarea>
      </div>
      <div class="form-actions">
        <button class="btn" onclick="addNote()">Send Note 💌</button>
      </div>
    </div>
    <div class="notes-grid" id="notes-list"></div>
  </div>

  <!-- STATS PANEL -->
  <div class="panel" id="panel-stats">
    <div class="section-title"><span>💖</span> Our Story in Numbers</div>
    <div class="stats-grid" id="stats-grid"></div>

    <div class="card" style="margin-top: 1rem;">
      <div class="section-title" style="font-size:1rem; margin-bottom: 0.8rem;"><span>🌡️</span> Relationship Vibe Check</div>
      <p style="font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 1rem;">How are you both feeling today?</p>
      <div class="card-row">
        <div>
          <label id="vibe-label-1">Partner 1 vibes</label>
          <div class="mood-row">
            <button class="mood-btn" onclick="setVibe(1,this,'🔥 On fire')">🔥 On fire</button>
            <button class="mood-btn" onclick="setVibe(1,this,'💕 Loving')">💕 Loving</button>
            <button class="mood-btn" onclick="setVibe(1,this,'😊 Good')">😊 Good</button>
            <button class="mood-btn" onclick="setVibe(1,this,'😔 Meh')">😔 Meh</button>
          </div>
        </div>
        <div>
          <label id="vibe-label-2">Partner 2 vibes</label>
          <div class="mood-row">
            <button class="mood-btn" onclick="setVibe(2,this,'🔥 On fire')">🔥 On fire</button>
            <button class="mood-btn" onclick="setVibe(2,this,'💕 Loving')">💕 Loving</button>
            <button class="mood-btn" onclick="setVibe(2,this,'😊 Good')">😊 Good</button>
            <button class="mood-btn" onclick="setVibe(2,this,'😔 Meh')">😔 Meh</button>
          </div>
        </div>
      </div>
      <div id="vibe-result" style="margin-top: 1rem; text-align:center; font-family:'Playfair Display',serif; font-style:italic; color: var(--rose-deep); font-size: 1rem;"></div>
    </div>
  </div>

</div>

<script>
// ---- DATA LAYER ----
let data = {
  name1: '', name2: '', startDate: '',
  memories: [], anniversaries: [], dateIdeas: [], notes: [],
  vibe1: '', vibe2: ''
};

const DEFAULT_DATE_IDEAS = [
  { emoji: '🍳', name: 'Cook Together', desc: 'Try a new recipe at home' },
  { emoji: '🎬', name: 'Movie Night', desc: 'Cozy cinema at home' },
  { emoji: '🌅', name: 'Sunrise Walk', desc: 'Early morning adventure' },
  { emoji: '🍷', name: 'Wine & Cheese', desc: 'Fancy fridge raid evening' },
  { emoji: '🎲', name: 'Game Night', desc: 'Board games & laughter' },
  { emoji: '🌿', name: 'Picnic', desc: 'Park, blanket, snacks' },
  { emoji: '🎨', name: 'Paint Night', desc: 'Get creative together' },
  { emoji: '💆', name: 'Spa Night', desc: 'At-home pampering' },
  { emoji: '🎭', name: 'Explore', desc: 'New neighbourhood walk' },
  { emoji: '🌟', name: 'Stargazing', desc: 'Dark spot + blanket' },
  { emoji: '📚', name: 'Book Club', desc: 'Read the same book' },
  { emoji: '🎵', name: 'Dance Night', desc: 'Living room dancing' },
];

function save() { localStorage.setItem('love-tracker', JSON.stringify(data)); }

function load() {
  try {
    const raw = localStorage.getItem('love-tracker');
    if (raw) {
      const d = JSON.parse(raw);
      Object.assign(data, d);
    }
  } catch(e) {}
  if (!data.dateIdeas || !data.dateIdeas.length) data.dateIdeas = [...DEFAULT_DATE_IDEAS];
}

// ---- INIT ----
load();
document.getElementById('name1').value = data.name1;
document.getElementById('name2').value = data.name2;
document.getElementById('startDate').value = data.startDate;
document.getElementById('n-from').value = data.name1 || '';
updateCounter();
renderAll();

document.getElementById('name1').addEventListener('input', e => { data.name1 = e.target.value; save(); updateCounter(); updateVibeLabels(); });
document.getElementById('name2').addEventListener('input', e => { data.name2 = e.target.value; save(); updateCounter(); updateVibeLabels(); });
document.getElementById('startDate').addEventListener('input', e => { data.startDate = e.target.value; save(); updateCounter(); });

function updateVibeLabels() {
  document.getElementById('vibe-label-1').textContent = (data.name1 || 'Partner 1') + "'s vibes";
  document.getElementById('vibe-label-2').textContent = (data.name2 || 'Partner 2') + "'s vibes";
}

function updateCounter() {
  updateVibeLabels();
  const el = document.getElementById('dayCounter');
  if (!data.startDate) { el.style.display = 'none'; return; }
  const start = new Date(data.startDate);
  const now = new Date();
  const days = Math.floor((now - start) / 86400000);
  if (days < 0) { el.style.display = 'none'; return; }
  let txt = `${days.toLocaleString()} days together`;
  if (data.name1 && data.name2) txt = `${data.name1} & ${data.name2} · ${txt}`;
  el.textContent = txt;
  el.style.display = 'inline-block';
}

// ---- TABS ----
function switchTab(id) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById('panel-' + id).classList.add('active');

}

// ---- MEMORIES ----
function addMemory() {
  const title = document.getElementById('m-title').value.trim();
  const date = document.getElementById('m-date').value;
  const desc = document.getElementById('m-desc').value.trim();
  const cat = document.getElementById('m-cat').value;
  const feel = document.getElementById('m-feel').value;
  if (!title) { alert('Add a title for this memory ♡'); return; }
  data.memories.unshift({ id: Date.now(), title, date, desc, cat, feel });
  save();
  renderMemories();
  document.getElementById('m-title').value = '';
  document.getElementById('m-date').value = '';
  document.getElementById('m-desc').value = '';
}

function deleteMemory(id) {
  data.memories = data.memories.filter(m => m.id !== id);
  save(); renderMemories();
}

function renderMemories() {
  const el = document.getElementById('memories-list');
  if (!data.memories.length) {
    el.innerHTML = '<div class="empty-state"><div class="big">✨</div>No memories yet.<br>Add your first one above!</div>'; return;
  }
  el.innerHTML = data.memories.map(m => `
    <div class="memory-item">
      <div class="memory-emoji">${m.cat.split(' ')[0]}</div>

          ${m.date ? `<span class="memory-date">${fmtDate(m.date)}</span>` : ''}

          <span class="tag">${m.feel}</span>
        </div>
      </div>
      <button class="delete-btn" onclick="deleteMemory(${m.id})" title="Delete">✕</button>

}

// ---- ANNIVERSARIES ----
function addAnniversary() {
  const name = document.getElementById('a-name').value.trim();
  const date = document.getElementById('a-date').value;
  if (!name || !date) { alert('Fill in name and date ♡'); return; }
  data.anniversaries.push({ id: Date.now(), name, date });
  save(); renderAnniversaries();
  document.getElementById('a-name').value = '';
  document.getElementById('a-date').value = '';
}

function deleteAnniversary(id) {
  data.anniversaries = data.anniversaries.filter(a => a.id !== id);
  save(); renderAnniversaries();
}

function daysUntilNextOccurrence(dateStr) {
  const [y, mo, d] = dateStr.split('-').map(Number);
  const today = new Date(); today.setHours(0,0,0,0);
  let next = new Date(today.getFullYear(), mo-1, d);
  if (next < today) next.setFullYear(today.getFullYear() + 1);
  return Math.floor((next - today) / 86400000);
}

function renderAnniversaries() {
  const el = document.getElementById('anniversaries-list');
  if (!data.anniversaries.length) {
    el.innerHTML = '<div class="empty-state"><div class="big">📅</div>No dates added yet.</div>'; return;
  }
  const sorted = [...data.anniversaries].sort((a,b) => daysUntilNextOccurrence(a.date) - daysUntilNextOccurrence(b.date));
  el.innerHTML = sorted.map(a => {
    const days = daysUntilNextOccurrence(a.date);
    const isToday = days === 0;
    const isSoon = days <= 14 && !isToday;
    return `
      <div class="anni-item">
        <div class="anni-countdown ${isToday ? 'anni-today' : isSoon ? 'anni-soon' : ''}">
          <div class="anni-days ${isToday ? 'anni-days-today' : isSoon ? 'anni-days-soon' : ''}">${isToday ? '🎉' : days}</div>
          <div class="anni-label ${isToday ? 'anni-label-today' : ''}">${isToday ? 'TODAY!' : days === 1 ? 'day' : 'days'}</div>
        </div>
        <div class="anni-body">
          <div class="anni-name">${esc(a.name)}</div>
          <div class="anni-date">${fmtDate(a.date)}</div>
        </div>
        <button class="delete-btn" onclick="deleteAnniversary(${a.id})">✕</button>
      </div>`;
  }).join('');
}

// ---- DATE IDEAS ----
let pickedIdea = null;
function renderDateIdeas() {

    <div class="date-idea" onclick="toggleDateIdea(${i})" id="di-${i}">

function toggleDateIdea(i) {

function spinDateIdea() {

function addDateIdea() {

// ---- LOVE NOTES ----
let selectedMood = '';
function selectMood(btn, mood) {

// ---- STATS ----
function renderStats() {
  updateVibeLabels();

  const grid = document.getElementById('stats-grid');

// ---- VIBE CHECK ----
let vibes = { 1: '', 2: '' };
function setVibe(n, btn, mood) {
  const parent = btn.closest('.card-row > div');

function checkVibes() {

  const combos = {
    '🔥 On fire+🔥 On fire': '🔥 You two are absolutely electric right now!',
    '💕 Loving+💕 Loving': '💕 Pure sweetness — a perfect harmony.',
    '🔥 On fire+💕 Loving': '✨ One brings fire, one brings warmth — a beautiful mix.',
    '💕 Loving+🔥 On fire': '✨ Perfect balance of warmth and passion.',
    '😊 Good+😊 Good': '😊 Steady and solid — the foundation of everything great.',
    '😔 Meh+😔 Meh': '🌱 Everyone has quiet days. A little quality time might help.',
    'default': '💖 Different moods, same love. Check in with each other today ♡'
  };
  const key = vibes[1] + '+' + vibes[2];

// ---- CONFETTI ----
function burstConfetti() {
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const particles = Array.from({length: 60}, () => ({
    x: Math.random() * canvas.width,
    y: -10, vx: (Math.random()-0.5)*3,
    vy: Math.random()*4+2,
    r: Math.random()*6+3,
    color: ['#c8687a','#f5dde2','#c9a85c','#f7eedd','#8c3a4a'][Math.floor(Math.random()*5)],
    rot: Math.random()*360, vr: (Math.random()-0.5)*6
  }));
  let frame = 0;
  function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);
      ctx.restore();
    });
    frame++;
    if (frame < 80) requestAnimationFrame(animate);
    else canvas.remove();
  }
  animate();
}

// ---- HELPERS ----
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-');
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${months[parseInt(m,10)-1]} ${parseInt(day,10)}, ${y}`;
}

function renderAll() {
  renderMemories();
  renderAnniversaries();
  renderDateIdeas();
  renderNotes();
  updateVibeLabels();
}

// Auto-add relationship anniversary if start date is set
window.addEventListener('load', () => {
  if (data.startDate && !data.anniversaries.find(a => a.name === 'Our Anniversary')) {
    const exists = data.anniversaries.find(a => a.date === data.startDate);
    if (!exists) {
      data.anniversaries.push({ id: Date.now(), name: 'Our Anniversary', date: data.startDate });
      save(); renderAnniversaries();
    }
  }
});

document.getElementById('startDate').addEventListener('change', e => {
  const d = e.target.value;
  if (d) {
    const exists = data.anniversaries.find(a => a.name === 'Our Anniversary');
    if (exists) { exists.date = d; }
    else { data.anniversaries.push({ id: Date.now(), name: 'Our Anniversary', date: d }); }
    save(); renderAnniversaries();
  }
});
